name: CI

# Correctness gate: every job here blocks merging to main (branch protection).
# Performance tests run in performance.yml (nightly and on releases).

on:
  push:
    branches: [main, 'phase-*/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Manual runs (used to verify stability) never cancel each other.
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  database:
    name: Database migrations and SQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run SQL test suites
        run: bash database/scripts/verify.sh

  api:
    name: API lint, typecheck, build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      checks: write
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start resource monitor
        run: bash .github/scripts/monitor.sh start
      - name: Start S3-compatible storage (SeaweedFS), ClamAV and Poppler for media tests
        run: bash .github/scripts/start-test-services.sh
      - run: pnpm --filter @estatepro/api lint
      - run: pnpm --filter @estatepro/api typecheck
      - run: pnpm --filter @estatepro/api build
      - name: Tests with coverage thresholds (includes the OpenAPI contract check)
        run: pnpm --filter @estatepro/api test:ci
      - name: Diagnostics
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/monitor.sh stop
          bash .github/scripts/ci-diagnostics.sh "API lint, typecheck, build and tests" apps/api/test-results/vitest.json vitest
      - name: Keep test report and resource samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-diagnostics
          path: |
            apps/api/test-results
            ${{ runner.temp }}/monitor.log
            ${{ runner.temp }}/diagnostics.md
          retention-days: 14
          if-no-files-found: ignore

  web:
    name: Web lint, typecheck, messages, unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The session store and sign-in flow tests use throwaway databases.
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @estatepro/web lint
      - run: pnpm --filter @estatepro/web typecheck
      - name: English and Arabic message files match (keys and placeholders)
        run: pnpm --filter @estatepro/web messages:check
      - name: Unit tests with coverage thresholds
        run: pnpm --filter @estatepro/web test
      - name: Production build
        run: pnpm --filter @estatepro/web build

  web-e2e:
    name: Web end-to-end (Playwright, axe, English and Arabic, 320 px to desktop)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [web, api]
    permissions:
      contents: read
      actions: read
      checks: write
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/playwright.json
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start resource monitor
        run: bash .github/scripts/monitor.sh start
      - name: Start S3-compatible storage (SeaweedFS) and ClamAV for uploads
        run: bash .github/scripts/start-test-services.sh
      - name: Install Chromium for Playwright
        run: pnpm --filter @estatepro/web exec playwright install --with-deps chromium
      - name: Build the API (the e2e harness runs its built output)
        run: pnpm --filter @estatepro/api build
      - name: End-to-end suite (functional and accessibility; performance runs nightly)
        run: pnpm --filter @estatepro/web test:e2e:ci --reporter=list,json
      - name: Diagnostics
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/monitor.sh stop
          bash .github/scripts/ci-diagnostics.sh "Web end-to-end (Playwright, axe, English and Arabic, 320 px to desktop)" apps/web/test-results/playwright.json playwright
      - name: Keep the report, traces and resource samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            ${{ runner.temp }}/monitor.log
            ${{ runner.temp }}/diagnostics.md
          retention-days: 14
          if-no-files-found: ignore

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the full history
        run: |
          docker run --rm -v "$PWD":/repo -w /repo ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git --log-opts="--all" --config /repo/.gitleaks.toml --redact --verbose --exit-code 1 /repo

  dependencies:
    name: Dependency scanning (OSV-Scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - name: Scan the lockfile against the OSV database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          docker run --rm -v "$PWD":/repo -w /repo ghcr.io/google/osv-scanner:v2.0.2 \
            scan source --config /repo/osv-scanner.toml --lockfile /repo/pnpm-lock.yaml --format markdown > "$RUNNER_TEMP/osv.md"
          status=$?
          set -e
          { echo "### Dependency scan (exit $status)"; echo; cat "$RUNNER_TEMP/osv.md"; } > "$RUNNER_TEMP/osv-summary.md"
          cat "$RUNNER_TEMP/osv-summary.md"
          bash .github/scripts/post-check-summary.sh "Dependency scanning (OSV-Scanner)" "$RUNNER_TEMP/osv-summary.md" "OSV-Scanner"
          exit $status
