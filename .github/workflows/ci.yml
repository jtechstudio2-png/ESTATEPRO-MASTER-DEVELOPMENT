name: CI

on:
  push:
    branches: [main, 'phase-*/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database migrations and SQL tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run SQL test suites
        run: bash database/scripts/verify.sh

  api:
    name: API lint, typecheck, build and tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start S3-compatible storage (SeaweedFS), ClamAV and Poppler for media tests
        run: |
          mkdir -p "$RUNNER_TEMP/seaweed"
          printf '%s' '{"identities":[{"name":"estatepro","credentials":[{"accessKey":"estatepro-test","secretKey":"estatepro-test-secret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > "$RUNNER_TEMP/seaweed/s3.json"
          docker run -d --name seaweedfs -p 8333:8333 -v "$RUNNER_TEMP/seaweed":/config chrislusf/seaweedfs:3.80 server -s3 -s3.port=8333 -s3.config=/config/s3.json -dir=/data
          docker run -d --name clamav -p 3310:3310 clamav/clamav:1.4
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          # clamd starts after the first signature download (about 1-3 minutes).
          for i in $(seq 1 90); do (printf 'zPING\0' | nc -q1 127.0.0.1 3310 | grep -q PONG) && break; sleep 4; done
          printf 'zPING\0' | nc -q1 127.0.0.1 3310 | grep -q PONG
          curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8333/
      - run: pnpm --filter @estatepro/api lint
      - run: pnpm --filter @estatepro/api typecheck
      - run: pnpm --filter @estatepro/api build
      - name: Tests with coverage thresholds (includes the OpenAPI contract check)
        run: pnpm --filter @estatepro/api test

  web:
    name: Web lint, typecheck, messages, unit tests and build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The session store and sign-in flow tests use throwaway databases.
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @estatepro/web lint
      - run: pnpm --filter @estatepro/web typecheck
      - name: English and Arabic message files match (keys and placeholders)
        run: pnpm --filter @estatepro/web messages:check
      - name: Unit tests with coverage thresholds
        run: pnpm --filter @estatepro/web test
      - name: Production build
        run: pnpm --filter @estatepro/web build

  web-e2e:
    name: Web end-to-end (Playwright, axe, English and Arabic, 320 px to desktop)
    runs-on: ubuntu-24.04
    needs: [web, api]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start S3-compatible storage (SeaweedFS) and ClamAV for uploads
        run: |
          mkdir -p "$RUNNER_TEMP/seaweed"
          printf '%s' '{"identities":[{"name":"estatepro","credentials":[{"accessKey":"estatepro-test","secretKey":"estatepro-test-secret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > "$RUNNER_TEMP/seaweed/s3.json"
          docker run -d --name seaweedfs -p 8333:8333 -v "$RUNNER_TEMP/seaweed":/config chrislusf/seaweedfs:3.80 server -s3 -s3.port=8333 -s3.config=/config/s3.json -dir=/data
          docker run -d --name clamav -p 3310:3310 clamav/clamav:1.4
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          for i in $(seq 1 90); do (printf 'zPING\0' | nc -q1 127.0.0.1 3310 | grep -q PONG) && break; sleep 4; done
          printf 'zPING\0' | nc -q1 127.0.0.1 3310 | grep -q PONG
      - name: Install Chromium for Playwright
        run: pnpm --filter @estatepro/web exec playwright install --with-deps chromium
      - name: Build the API (the e2e harness runs its built output)
        run: pnpm --filter @estatepro/api build
      - name: End-to-end suite
        run: pnpm --filter @estatepro/web test:e2e
      - name: Keep the report and traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
